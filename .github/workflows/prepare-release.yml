name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to release"
        required: true
        default: "polder"
        type: choice
        options:
          - polder
          - notes
          - calendar

jobs:
  prepare-release:
    name: Tag ${{ inputs.app }} Release
    runs-on: ubuntu-latest
    steps:
      # A tag pushed with the bot token triggers the build workflow; one pushed with GITHUB_TOKEN would not.
      - name: Generate Bot Token
        id: generate-token
        uses: actions/create-github-app-token@v3.1.1
        with:
          app-id: ${{ secrets.FLADDER_BOT_APP_ID }}
          private-key: ${{ secrets.FLADDER_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Merge Develop Into Main
        run: git merge --ff-only origin/develop

      - name: Extract Version
        id: version
        env:
          APP: ${{ inputs.app }}
        run: |
          PUBSPEC="client/apps/$APP/pubspec.yaml"
          FULL_VERSION=$(grep '^version: ' "$PUBSPEC" | sed 's/version: //')
          VERSION_NAME=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          if [[ "$APP" == "polder" ]]; then TAG="v${VERSION_NAME}"; else TAG="${APP}-v${VERSION_NAME}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TAG is already tagged, bump the version in $PUBSPEC first"
          else
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push Main And Tag
        if: steps.version.outputs.is_new_version == 'true'
        run: |
          git config user.name "Fladder Bot"
          git config user.email "fladder-bot[bot]@users.noreply.github.com"

          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push --atomic origin main "$TAG"
