name: ci
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: polder
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - run: go test -race ./...
        env:
          POLDER_TEST_POSTGRES_DSN: postgres://postgres:testpass@127.0.0.1:5432/polder?sslmode=disable

  client-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: client/openapi/polder.json matches the server (run scripts/gen-client.sh)
        run: |
          go run ./cmd/polder openapi | jq -S . > /tmp/server.json
          jq -S . client/openapi/polder.json > /tmp/client.json
          diff -u /tmp/client.json /tmp/server.json

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.19.0
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
