name: Build Flatpak

on:
  workflow_call:
    inputs:
      build_number:
        required: true
        type: string
      channel:
        required: true
        type: string
      optional:
        required: false
        default: false
        type: boolean
    outputs:
      built:
        value: ${{ jobs.build.outputs.built }}
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: ${{ inputs.optional == true }}
    outputs:
      built: ${{ steps.result.outputs.built }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Restore flatpak-builder cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          key: flatpak-gnome51-${{ hashFiles('client/flatpak/org.knaapen.polder.yml') }}
          restore-keys: flatpak-gnome51-

      - name: Write build settings
        run: |
          cat > client/flatpak/build.env <<EOF
          BUILD_NUMBER=${{ inputs.build_number || github.run_number }}
          POLDER_CHANNEL=${{ inputs.channel || 'dev' }}
          POLDER_UPDATE_PUBLIC_KEY=${{ secrets.UPDATE_PUBLIC_KEY }}
          EOF

      - name: Build Flatpak
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --repo=repo --disable-rofiles-fuse --install-deps-from=flathub \
            --force-clean --ccache build-dir client/flatpak/org.knaapen.polder.yml
          flatpak build-bundle repo Polder.flatpak org.knaapen.polder \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Save flatpak-builder cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder
          key: flatpak-gnome51-${{ hashFiles('client/flatpak/org.knaapen.polder.yml') }}

      - name: Archive Linux Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: polder-linux-flatpak
          path: Polder.flatpak

      - name: Report result
        id: result
        run: echo "built=true" >> "$GITHUB_OUTPUT"
