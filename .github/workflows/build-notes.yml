name: Build Polder Notes

on:
  push:
    tags:
      - "notes-v*"
    branches:
      - develop
    paths:
      - client/apps/notes/**
      - client/packages/**
      - client/pubspec.yaml
      - client/pubspec.lock
      - client/.fvmrc
      - client/flatpak/**
      - client/scripts/**
      - .github/workflows/build-app.yml
      - .github/workflows/build-notes.yml
  pull_request:
    paths:
      - client/pubspec.yaml
      - client/apps/notes/pubspec.yaml
      - client/.fvmrc
      - .github/workflows/build-app.yml
      - .github/workflows/build-notes.yml
    types:
      - opened
      - reopened
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release, nightly)"
        required: false
        default: "nightly"
        type: choice
        options:
          - release
          - nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      build_type: ${{ github.event.inputs.build_type }}
      app: notes
      name: Polder Notes
      asset_prefix: Polder-Notes
      binary: polder_notes
      app_id: org.knaapen.polder.notes
      tag_prefix: "notes-v"
      nightly_tag: notes-nightly
      changelog_paths: "client/apps/notes client/packages client/pubspec.yaml"
