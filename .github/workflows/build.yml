name: Build Polder

on:
  push:
    tags:
      - "v*"
    branches:
      - develop
  pull_request:
    paths:
      - client/pubspec.yaml
      - client/.fvmrc
      - .github/workflows/build.yml
    types:
      - opened
      - reopened
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release, nightly)"
        required: false
        default: "nightly"
        type: choice
        options:
          - release
          - nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY_TAG: nightly

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.check.outputs.build_type }}
    steps:
      - name: Determine build type
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          elif [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            BUILD_TYPE="release"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            BUILD_TYPE="nightly"
          else
            # PRs and other pushes build but don't release
            BUILD_TYPE="development"
          fi

          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "Build type determined: ${BUILD_TYPE}"

  fetch-info:
    needs: [check-trigger]
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.fetch.outputs.version_name }}
      flutter_version: ${{ steps.fetch.outputs.flutter_version }}
      nightly_version: ${{ steps.fetch.outputs.nightly_version }}
      build_type: ${{ needs.check-trigger.outputs.build_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Fetch version name and create nightly version
        id: fetch
        working-directory: client
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | cut -d ':' -f2 | cut -d '+' -f1 | tr -d ' ')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)
          echo "flutter_version=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${{ needs.check-trigger.outputs.build_type }}" == "nightly" ]]; then
            NIGHTLY_VERSION="${VERSION_NAME}-nightly"
            echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Nightly version: $NIGHTLY_VERSION"
          fi

          echo "Base version: $VERSION_NAME"
          echo "Flutter version: $FLUTTER_VERSION"
        shell: bash

  build-android:
    needs: [fetch-info]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    outputs:
      artifact_suffix: ${{ env.ARTIFACT_SUFFIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Determine Build Type
        run: |
          echo "ARTIFACT_SUFFIX=${{ needs.fetch-info.outputs.build_type }}" >> $GITHUB_ENV
          echo "ARTIFACT_SUFFIX=${{ needs.fetch-info.outputs.build_type }}" >> $GITHUB_OUTPUT

      # Without the keystore secrets the release build falls back to the debug keys.
      - name: Decode Keystore for release
        if: needs.fetch-info.outputs.build_type != 'development'
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE_64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$ENCODED_STRING" ]; then
            echo "::warning::KEYSTORE_BASE_64 is not set, signing with the debug keys"
            exit 0
          fi
          echo "$ENCODED_STRING" | base64 -d > android/app/keystore.jks

          cat > android/app/key.properties <<EOF
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyPassword=$RELEASE_KEY_PASSWORD
          keyAlias=$RELEASE_KEYSTORE_ALIAS
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          check-latest: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (PRs)
        if: needs.fetch-info.outputs.build_type == 'development'
        run: flutter build apk --debug --split-per-abi --build-number=${{ github.run_number }}

      - name: Build Android APK and AAB
        if: needs.fetch-info.outputs.build_type != 'development'
        run: |
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Rename APK for PR
        if: needs.fetch-info.outputs.build_type == 'development'
        run: |
          mkdir -p build/app/outputs/android_artifacts
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-prod-debug.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-prod-debug.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-prod-debug.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-x86_64.apk || true

      - name: Rename APK and AAB
        if: needs.fetch-info.outputs.build_type != 'development'
        run: |
          mkdir -p build/app/outputs/android_artifacts
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-prod-release.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-x86_64.apk || true
          mv build/app/outputs/bundle/prodRelease/app-prod-release.aab build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}.aab

      - name: Archive Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polder-android
          path: client/build/app/outputs/android_artifacts/

  build-windows:
    runs-on: windows-2022
    needs: [fetch-info]
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --build-number=${{ github.run_number }}

      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: client/windows/windows_setup.iss
          options: /O+ /DPOLDER_VERSION="${{ needs.fetch-info.outputs.version_name }}"

      - name: Archive Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: polder-windows-portable
          path: client\build\windows\x64\prod\runner\Release\

      - name: Archive Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: polder-windows-installer
          path: client\windows\Output\polder_setup.exe

  build-ios:
    runs-on: macos-latest
    needs: [fetch-info]
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS app
        run: flutter build ipa --no-codesign --build-number=${{ github.run_number }}

      - name: Create unsigned IPA
        run: |
          cd build/ios/archive/Runner.xcarchive/Products/Applications/
          mkdir Payload
          mv Runner.app Payload/
          zip -r iOS.ipa Payload

      - name: Archive iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: polder-iOS
          path: client/build/ios/archive/Runner.xcarchive/Products/Applications/iOS.ipa

  # flutter_inappwebview_macos fails to compile with Xcode 26 (the macos-latest default); Xcode 27 builds it.
  build-macos:
    runs-on: xcode-27
    needs: [fetch-info]
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --build-number=${{ github.run_number }}

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: ./scripts/create_dmg.sh

      - name: Archive macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: polder-macOS
          path: client/build/macos/Build/Products/Release-prod/macOS.dmg

  # flutter_inappwebview_linux only compiles against WPE WebKit 2.50-2.52: older releases lack APIs it uses and 2.54
  # removed one. Ubuntu doesn't ship WPE at all, so build on Debian with 2.52 pinned from the archive snapshot.
  build-linux:
    runs-on: ubuntu-latest
    needs: [fetch-info]
    container:
      image: debian:forky
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - name: Get packages
        working-directory: .
        run: |
          echo "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260910T000000Z/ sid main" \
            > /etc/apt/sources.list.d/wpe-snapshot.list
          apt-get update -y
          apt-get install -y --no-install-recommends ca-certificates curl wget git jq unzip xz-utils zip file \
            clang g++ cmake ninja-build pkg-config patchelf libgtk-3-dev libsecret-1-dev libepoxy-dev libwayland-dev \
            libwpe-1.0-dev libwpebackend-fdo-1.0-dev libwpewebkit-2.0-dev=2.52.6-1 libwpewebkit-2.0-1=2.52.6-1
          # The Flutter SDK in the tool cache is owned by the runner user, not the container's root.
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Update build number in pubspec.yaml
        run: |
          sed -i -E 's/(version: [0-9]+\.[0-9]+\.[0-9]+\+)[0-9]+/\1${{ github.run_number }}/' pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release --build-number=${{ github.run_number }}

      - name: Fix RPATH
        run: |
          for lib in "build/linux/x64/prod/release/bundle/lib"/*.so; do
            [[ -f "$lib" && -n "$(patchelf --print-rpath "$lib")" ]] && \
            patchelf --set-rpath '$ORIGIN' "$lib"
          done
          patchelf --set-rpath '$ORIGIN/lib' "build/linux/x64/prod/release/bundle/polder"

      - name: Archive Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: polder-linux
          path: client/build/linux/x64/prod/release/bundle

      - name: Build AppImage
        run: |
          VERSION_TO_USE="${{ needs.fetch-info.outputs.version_name }}"
          sed -i -E "s/(version:\\s*)latest/\\1${VERSION_TO_USE}/" AppImageBuilder.yml
          wget -O appimage-builder-x86_64.AppImage https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x appimage-builder-x86_64.AppImage
          mv appimage-builder-x86_64.AppImage /usr/local/bin/appimage-builder
          appimage-builder --recipe AppImageBuilder.yml

      - name: Archive Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: polder-linux-appimage
          path: |
            client/Polder_x86_64.AppImage
            client/Polder_x86_64.AppImage.zsync

  build-web:
    runs-on: ubuntu-latest
    needs: [fetch-info]
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build web app
        run: |
          flutter build web --release --no-web-resources-cdn --no-wasm-dry-run --build-number=${{ github.run_number }}
          find build/web -name '*.symbols' -delete

      - name: Archive web artifact
        uses: actions/upload-artifact@v4
        with:
          name: polder-web
          path: client/build/web

  build-docker:
    needs: [fetch-info]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/polder"
          case "${{ needs.fetch-info.outputs.build_type }}" in
            release) TAGS="${IMAGE}:${{ needs.fetch-info.outputs.version_name }},${IMAGE}:latest" ;;
            nightly) TAGS="${IMAGE}:${{ env.NIGHTLY_TAG }}" ;;
            *)       TAGS="${IMAGE}:development" ;;
          esac
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "push=${{ needs.fetch-info.outputs.build_type != 'development' }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            WEB=client
            FLUTTER_VERSION=${{ needs.fetch-info.outputs.flutter_version }}
            VERSION=${{ needs.fetch-info.outputs.build_type == 'nightly' && needs.fetch-info.outputs.nightly_version || needs.fetch-info.outputs.version_name }}
            BUILD_NUMBER=${{ github.run_number }}
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.fetch-info.outputs.build_type == 'nightly' && needs.fetch-info.outputs.nightly_version || needs.fetch-info.outputs.version_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create_release:
    name: Create Release
    needs:
      - fetch-info
      - build-android
      - build-windows
      - build-ios
      - build-macos
      - build-linux
      - build-web
      - build-docker
    runs-on: ubuntu-latest
    if: needs.fetch-info.outputs.build_type == 'release' || needs.fetch-info.outputs.build_type == 'nightly'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        if: needs.fetch-info.outputs.build_type == 'nightly'
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Set version variables
        id: version
        run: |
          if [[ "${{ needs.fetch-info.outputs.build_type }}" == "nightly" ]]; then
            echo "version=${{ needs.fetch-info.outputs.nightly_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ needs.fetch-info.outputs.version_name }}" >> $GITHUB_OUTPUT
          fi
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/polder" >> $GITHUB_OUTPUT

      - name: Delete existing nightly release
        if: needs.fetch-info.outputs.build_type == 'nightly'
        run: |
          if gh release view ${{ env.NIGHTLY_TAG }} >/dev/null 2>&1; then
            echo "Deleting existing nightly release..."
            gh release delete ${{ env.NIGHTLY_TAG }} --yes --cleanup-tag
          else
            echo "No existing nightly release found."
          fi

          if git tag -l | grep -q "^${{ env.NIGHTLY_TAG }}$"; then
            echo "Deleting orphaned nightly tag..."
            git push origin --delete ${{ env.NIGHTLY_TAG }} || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        if: needs.fetch-info.outputs.build_type == 'nightly'
        run: |
          LATEST_STABLE_RELEASE=$(gh release list --limit 50 --exclude-drafts --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == false) | .tagName' | head -1 || echo "")

          cat > changelog.md <<-EOF
          # $(date -u "+%Y-%m-%d %H:%M:%S UTC")

          This is an automated nightly build containing the latest changes from the develop branch.

          **⚠️ Warning:** This is a development build and may contain bugs or incomplete features.

          ## 🐳 Server

          \`\`\`
          docker pull ${{ steps.version.outputs.image }}:${{ env.NIGHTLY_TAG }}
          \`\`\`
          EOF

          if [ -n "$LATEST_STABLE_RELEASE" ]; then
            cat >> changelog.md <<-EOF

          ## 📋 What's Changed

          See all changes since the latest release: [Compare $LATEST_STABLE_RELEASE...HEAD](https://github.com/${{ github.repository }}/compare/$LATEST_STABLE_RELEASE...HEAD)
          EOF
          else
            cat >> changelog.md <<-EOF

          ## 📋 What's Changed

          See all changes: [View commits](https://github.com/${{ github.repository }}/commits/develop)
          EOF
          fi

          cat >> changelog.md <<-EOF

          ---

          📅 **Build Date:** $(date -u "+%Y-%m-%d %H:%M:%S UTC")
          🔧 **Build Number:** ${{ github.run_number }}
          📝 **Commit:** ${{ github.sha }}
          🌿 **Branch:** develop
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Artifacts Android
        uses: actions/download-artifact@v4
        with:
          name: polder-android
          path: polder-android

      - name: Move Android
        run: |
          mv polder-android/${{ needs.build-android.outputs.artifact_suffix }}-armeabi-v7a.apk Polder-Android-${{ steps.version.outputs.version }}-armeabi-v7a.apk || true
          mv polder-android/${{ needs.build-android.outputs.artifact_suffix }}-arm64-v8a.apk Polder-Android-${{ steps.version.outputs.version }}-arm64-v8a.apk || true
          mv polder-android/${{ needs.build-android.outputs.artifact_suffix }}-x86_64.apk Polder-Android-${{ steps.version.outputs.version }}-x86_64.apk || true
          mv polder-android/${{ needs.build-android.outputs.artifact_suffix }}.aab Polder-Android-${{ steps.version.outputs.version }}.aab

      - name: Download Windows portable artifact
        uses: actions/download-artifact@v4
        with:
          name: polder-windows-portable
          path: polder-windows-portable

      - name: Compress Windows
        run: |
          cd polder-windows-portable
          zip -r ../Polder-Windows-${{ steps.version.outputs.version }}.zip .

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: polder-windows-installer
          path: polder-windows-installer

      - name: Rename Windows installer
        run: mv polder-windows-installer/polder_setup.exe Polder-Windows-${{ steps.version.outputs.version }}-Setup.exe

      - name: Download Artifacts iOS
        uses: actions/download-artifact@v4
        with:
          name: polder-iOS
          path: polder-iOS

      - name: Move iOS
        run: mv polder-iOS/iOS.ipa Polder-iOS-${{ steps.version.outputs.version }}.ipa

      - name: Download Artifacts macOS
        uses: actions/download-artifact@v4
        with:
          name: polder-macOS
          path: polder-macOS

      - name: Move macOS
        run: mv polder-macOS/macOS.dmg Polder-macOS-${{ steps.version.outputs.version }}.dmg

      - name: Download Artifacts Linux
        uses: actions/download-artifact@v4
        with:
          name: polder-linux
          path: polder-linux

      - name: Compress Linux
        run: |
          cd polder-linux
          zip -r ../Polder-Linux-${{ steps.version.outputs.version }}.zip .

      - name: Download Artifacts Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: polder-linux-appimage
          path: polder-linux-appimage

      - name: Move Linux AppImages
        run: |
          mv polder-linux-appimage/Polder_x86_64.AppImage Polder-Linux-${{ steps.version.outputs.version }}.AppImage
          mv polder-linux-appimage/Polder_x86_64.AppImage.zsync Polder-Linux-${{ steps.version.outputs.version }}.AppImage.zsync

      - name: Download Artifacts Web
        uses: actions/download-artifact@v4
        with:
          name: polder-web
          path: polder-web

      - name: Compress Web
        run: |
          cd polder-web
          zip -r ../Polder-Web-${{ steps.version.outputs.version }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && env.NIGHTLY_TAG || github.ref_name }}
          name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && format('🌙 Nightly Build - {0}', steps.version.outputs.version) || '' }}
          body_path: ${{ needs.fetch-info.outputs.build_type == 'nightly' && 'changelog.md' || '' }}
          draft: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          prerelease: ${{ needs.fetch-info.outputs.build_type == 'nightly' }}
          make_latest: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          generate_release_notes: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          fail_on_unmatched_files: true
          files: |
            Polder-Android-${{ steps.version.outputs.version }}-arm64-v8a.apk
            Polder-Android-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            Polder-Android-${{ steps.version.outputs.version }}-x86_64.apk
            Polder-Android-${{ steps.version.outputs.version }}.aab
            Polder-Windows-${{ steps.version.outputs.version }}-Setup.exe
