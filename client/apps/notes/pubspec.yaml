name: polder_notes_app
description: "Polder Notes: the notes of a self-hosted Polder server."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  media_kit: ^1.2.2
  media_kit_libs_video: ^1.0.7
  calendar_views:
    path: ../../packages/calendar_views
  polder_account_link:
    path: ../../packages/polder_account_link
  polder_core:
    path: ../../packages/polder_core
  polder_media:
    path: ../../packages/polder_media
  polder_notes:
    path: ../../packages/polder_notes
  polder_ui:
    path: ../../packages/polder_ui
  polder_window:
    path: ../../packages/polder_window

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0

flutter:
  default-flavor: prod
  uses-material-design: true
