version: 1
script:
  - rm -rf AppDir || true
  - cp -r build/linux/x64/prod/release/bundle AppDir
  - mkdir -p AppDir/usr/share/icons/
  - cp assets/icon/desktop_icon.png AppDir/usr/share/icons/polder_drive_icon_desktop.png
  - mkdir -p AppDir/usr/share/applications/
  - cp linux/org.knaapen.polder.drive.desktop AppDir/usr/share/applications/
AppDir:
  path: ./AppDir
  app_info:
    id: org.knaapen.polder.drive
    name: Polder Drive
    icon: polder_drive_icon_desktop
    version: latest
    exec: polder_drive
    exec_args: $@
AppImage:
  arch: x86_64
  file_name: Polder_Drive_x86_64.AppImage
