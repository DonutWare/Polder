name: polder_drive_app
description: "Polder Drive: the files of a self-hosted Polder server."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.2.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  iconsax_plus: ^1.0.0
  media_kit: ^1.2.2
  media_kit_libs_video: ^1.0.7
  workmanager: ^0.10.10
  polder_drive:
    path: ../../packages/polder_drive
  polder_account_link:
    path: ../../packages/polder_account_link
  polder_core:
    path: ../../packages/polder_core
  polder_notes:
    path: ../../packages/polder_notes
  polder_ui:
    path: ../../packages/polder_ui
  polder_window:
    path: ../../packages/polder_window

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0

flutter:
  default-flavor: prod
  uses-material-design: true
