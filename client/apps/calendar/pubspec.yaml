name: polder_calendar_app
description: "Polder Calendar: the calendars of a self-hosted Polder server."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  iconsax_plus: ^1.0.0
  calendar_views:
    path: ../../packages/calendar_views
  polder_calendar:
    path: ../../packages/polder_calendar
  polder_core:
    path: ../../packages/polder_core
  polder_ui:
    path: ../../packages/polder_ui
  polder_window:
    path: ../../packages/polder_window

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0

flutter:
  default-flavor: prod
  uses-material-design: true
