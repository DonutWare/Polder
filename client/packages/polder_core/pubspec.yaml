name: polder_core
description: "Data layer shared by the Polder apps: API client, models, sign-in, offline storage and sync, realtime events."
publish_to: "none"

version: 0.1.0

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  background_downloader: ^9.6.4
  battery_plus: ^7.1.1
  chopper: ^8.7.1
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  cross_file: ^0.3.5+5
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  ffi: ^2.2.0
  file_picker: ^13.1.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^6.1.0
  freezed_annotation: ^3.1.0
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  polder_account_link:
    path: ../polder_account_link
  calendar_views:
    path: ../calendar_views

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  chopper_generator: ^8.7.1
  swagger_dart_code_generator: ^4.1.1
  flutter_lints: ^6.0.0

flutter:
  generate: true
