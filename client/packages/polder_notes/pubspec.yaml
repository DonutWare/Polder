name: polder_notes
description: "Notes feature of the Polder apps: markdown notes kept as files, with links, checklists, recipes and tags."
publish_to: "none"

version: 0.1.0

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cross_file: ^0.3.5+5
  desktop_drop: ^0.8.4
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  iconsax_plus: ^1.0.0
  markdown: ^7.3.1
  re_highlight: ^0.0.3
  wakelock_plus: ^1.8.0
  polder_core:
    path: ../polder_core
  polder_ui:
    path: ../polder_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
