name: polder_ui
description: "Shared look and building blocks of the Polder apps: theme, strings, layout, navigation, sign-in screens and common widgets."
publish_to: "none"

version: 0.1.0

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^4.0.4
  dynamic_color: ^2.1.0
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  iconsax_plus: ^1.0.0
  intl: ^0.20.3
  material_expressive: ^0.8.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  flutter_local_notifications: ^23.0.0
  permission_handler: ^13.0.2
  timezone: ^0.11.2
  web: ^1.1.1
  calendar_views:
    path: ../calendar_views
  polder_window:
    path: ../polder_window
  polder_core:
    path: ../polder_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/polder.svg
    - assets/icons/sso/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/rubik/Rubik-VariableFont_wght.ttf
          style: normal
        - asset: assets/fonts/rubik/Rubik-Italic-VariableFont_wght.ttf
          style: italic
