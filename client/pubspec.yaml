name: nomad
description: "Nomad client: files, sync and auto-upload for a self-hosted Nomad server."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^18.0.2
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  workmanager: ^0.10.10
  connectivity_plus: ^7.3.1
  battery_plus: ^7.1.1
  flutter_localizations:
    sdk: flutter
  iconsax_plus: ^1.0.0
  dynamic_color: ^2.1.0
  material_expressive: ^0.8.0
  flutter_web_plugins:
    sdk: flutter
  chopper: ^8.7.1
  http: ^1.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  fake_async: ^1.3.3
  chopper_generator: ^8.7.1
  swagger_dart_code_generator: ^4.1.1
  stream_channel: ^2.1.4

flutter:
  generate: true

  uses-material-design: true
