name: polder
description: "Polder client: files, sync and auto-upload for a self-hosted Polder server."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^18.0.2
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  workmanager: ^0.10.10
  connectivity_plus: ^7.3.1
  battery_plus: ^7.1.1
  flutter_localizations:
    sdk: flutter
  iconsax_plus: ^1.0.0
  dynamic_color: ^2.1.0
  material_expressive: ^0.8.0
  flutter_web_plugins:
    sdk: flutter
  chopper: ^8.7.1
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  permission_handler: ^13.0.2
  tray_manager: ^0.7.0
  window_manager: ^0.5.2
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  cunning_document_scanner: ^3.0.3
  pdf: ^3.13.1
  pdfrx: ^2.6.5
  device_info_plus: ^13.3.0
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_inappwebview_linux: ^0.1.0-beta.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  fake_async: ^1.3.3
  chopper_generator: ^8.7.1
  swagger_dart_code_generator: ^4.1.1
  stream_channel: ^2.1.4
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/icon/polder.svg

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/rubik/Rubik-VariableFont_wght.ttf
          style: normal
        - asset: assets/fonts/rubik/Rubik-Italic-VariableFont_wght.ttf
          style: italic
