flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: "ic_launcher"
  image_path_android: "assets/icon/android_legacy.png"
  min_sdk_android: 21
  adaptive_icon_background: "#24E2F2"
  adaptive_icon_foreground: "assets/icon/android_foreground.png"
  adaptive_icon_monochrome: "assets/icon/android_monochrome.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    background_color: "#24E2F2"
    theme_color: "#24E2F2"

  windows:
    generate: true
    image_path: "assets/icon/windows_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/desktop_icon.png"
