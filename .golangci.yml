version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - sqlclosecheck
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - os.Remove
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*io.PipeReader).Close
        - (*polder-server/internal/app.App).Close
        - (*polder-server/internal/search.Service).Close
        - (github.com/klippa-app/go-pdfium.Pdfium).Close
        - (github.com/klippa-app/go-pdfium.Pdfium).FPDF_CloseDocument
        - (*github.com/fsnotify/fsnotify.Watcher).Close
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, bodyclose]
formatters:
  enable:
    - gofmt
    - goimports
