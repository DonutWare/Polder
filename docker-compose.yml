services:
  polder:
    build:
      context: .
      args:
        # Embeds the web app from client/; set POLDER_WEB=none for an API-only image.
        WEB: ${POLDER_WEB:-client}
    image: polder-server:latest
    restart: unless-stopped
    ports:
      - "6060:6060"
    volumes:
      - ./config:/config
      - ./data:/data
    # Match the owner of ./config and ./data on the host.
    user: "${POLDER_UID:-1000}:${POLDER_GID:-1000}"
    environment:
      POLDER_DB_DRIVER: ${POLDER_DB_DRIVER:-sqlite}
      POLDER_DB_DSN: ${POLDER_DB_DSN:-}
      POLDER_COLLABORA_URL: ${POLDER_COLLABORA_URL:-}
      POLDER_WOPI_URL: ${POLDER_WOPI_URL:-http://polder:6060}

  # Optional PostgreSQL: `docker compose --profile postgres up -d` with
  # POLDER_DB_DRIVER=postgres and
  # POLDER_DB_DSN=postgres://polder:change-me@postgres:5432/polder?sslmode=disable
  postgres:
    profiles: ["postgres"]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: polder
      POSTGRES_USER: polder
      POSTGRES_PASSWORD: change-me
    volumes:
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "polder", "-d", "polder"]
      interval: 10s
      retries: 10

  # Optional document editor: `docker compose --profile office up -d` with
  # POLDER_COLLABORA_URL=http://collabora:9980. Clients reach it through Polder, so it has no port
  # of its own. Set COLLABORA_SSL_TERMINATION=true when Polder is served over https.
  collabora:
    profiles: ["office"]
    image: collabora/code:latest
    restart: unless-stopped
    cap_add:
      - MKNOD
    environment:
      # The only server allowed to hand Collabora files.
      aliasgroup1: ${POLDER_WOPI_URL:-http://polder:6060}
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=${COLLABORA_SSL_TERMINATION:-false}
        --o:admin_console.enable=false
        --o:welcome.enable=false
