services:
  polder:
    build:
      context: .
      args:
        # Embeds the web app from client/; set POLDER_WEB=none for an API-only image.
        WEB: ${POLDER_WEB:-client}
    image: polder-server:latest
    restart: unless-stopped
    ports:
      - "6060:6060"
    volumes:
      - ./config:/config
      - ./data:/data
    # Match the owner of ./config and ./data on the host.
    user: "${POLDER_UID:-1000}:${POLDER_GID:-1000}"
    environment:
      POLDER_DB_DRIVER: ${POLDER_DB_DRIVER:-sqlite}
      POLDER_DB_DSN: ${POLDER_DB_DSN:-}

  # Optional PostgreSQL: `docker compose --profile postgres up -d` with
  # POLDER_DB_DRIVER=postgres and
  # POLDER_DB_DSN=postgres://polder:change-me@postgres:5432/polder?sslmode=disable
  postgres:
    profiles: ["postgres"]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: polder
      POSTGRES_USER: polder
      POSTGRES_PASSWORD: change-me
    volumes:
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "polder", "-d", "polder"]
      interval: 10s
      retries: 10
