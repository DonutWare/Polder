services:
  polder:
    build:
      context: .
      args:
        # Embeds the web app from client/; set POLDER_WEB=none for an API-only image.
        WEB: ${POLDER_WEB:-client}
    image: polder-server:latest
    restart: unless-stopped
    ports:
      - "6060:6060"
    volumes:
      - ./config:/config
      - ./data:/data
    # Match the owner of ./config and ./data on the host.
    user: "${POLDER_UID:-1000}:${POLDER_GID:-1000}"
    environment:
      POLDER_DB_DRIVER: ${POLDER_DB_DRIVER:-sqlite}
      POLDER_DB_DSN: ${POLDER_DB_DSN:-}

  # Optional MariaDB: `docker compose --profile mariadb up -d` with
  # POLDER_DB_DRIVER=mariadb and
  # POLDER_DB_DSN=polder:change-me@tcp(mariadb:3306)/polder
  mariadb:
    profiles: ["mariadb"]
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: polder
      MARIADB_USER: polder
      MARIADB_PASSWORD: change-me
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - ./mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10
